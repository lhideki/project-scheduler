name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      # project_scheduler.html・docs/json-format.md・cli.mjs・README.md（README.en.md から生成）が
      # ソースから再生成した内容と一致していることを確認する
      - name: Check generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff --stat
            echo "::error::Generated files are out of date. Run 'npm run build' and commit the results."
            exit 1
          fi

      - name: Build Live Demo pages
        run: npm run build:pages
